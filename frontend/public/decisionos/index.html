<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux · Control Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%230E1116'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23E8519B' stroke-width='9'/><circle cx='50' cy='50' r='5' fill='%23E6EDF3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ================= Crux Control Room, design tokens (LOCKED, see CONTROL-ROOM.md 3e) ================= */
:root{
  --bg:#0E1116; --panel:#161B22; --panel-2:#1B222B; --line:#2A313C;
  --ink:#E6EDF3; --muted:#8B949E; --dim:#6E7681;
  --brand:#E8519B;
  --ok:#3FB950; --watch:#D29922; --act:#F85149; --info:#58A6FF;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --r:6px; --ease:cubic-bezier(0.2,0.7,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(232,81,155,0.35)}

/* ---- App shell: fixed sidebar + topbar + main ---- */
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:52px 1fr;height:100vh}
.brand{grid-column:1;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.brand-mark{width:20px;height:20px;border-radius:50%;border:5px solid var(--brand);flex:none}
.brand b{font-weight:700;letter-spacing:-0.01em}
.brand .mono{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;margin-left:auto}
.topbar{grid-column:2;grid-row:1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:14px;font-weight:600}
.topbar .crumb{color:var(--muted);font-size:12px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.env-chip{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3d2b3f,#22303f);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--ink)}

.side{grid-column:1;grid-row:2;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side-label{font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);padding:10px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r);color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;transition:background 140ms var(--ease),color 140ms var(--ease)}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item.active{background:var(--panel-2);color:var(--ink)}
.nav-item .glyph{width:16px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.nav-item.active .glyph{color:var(--brand)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.nav-badge.hot{border-color:rgba(248,81,73,0.5);color:var(--act)}
.agent-dot{width:7px;height:7px;border-radius:50%;flex:none}

.main{grid-column:2;grid-row:2;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.screen{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:screen-in 200ms var(--ease)}
@keyframes screen-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- Primitives ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:12px;font-weight:600;letter-spacing:0.02em}
.panel-h .mono{font-size:10px;color:var(--dim)}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill .dot{width:6px;height:6px;border-radius:50%}
.s-ok{color:var(--ok)} .s-watch{color:var(--watch)} .s-act{color:var(--act)} .s-info{color:var(--info)}
.b-ok{background:var(--ok)} .b-watch{background:var(--watch)} .b-act{background:var(--act)} .b-info{background:var(--info)}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{font-size:11px;color:var(--muted)}
.stub{padding:36px 20px;text-align:center;color:var(--dim);font-size:13px}
.stub .mono{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;color:var(--brand)}
.foot-note{max-width:1180px;margin:26px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;gap:8px;flex-wrap:wrap}
.foot-note b{color:var(--muted);font-weight:600}

/* ---- Intent Preview cards (trust pattern 1) ---- */
.review-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.review-head h2{font-size:15px;font-weight:600}
.review-head .mono{font-size:11px;color:var(--muted)}
.ip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr;gap:12px;transition:border-color 140ms var(--ease),opacity 200ms var(--ease),transform 200ms var(--ease)}
.ip.leaving{opacity:0;transform:translateX(10px)}
.ip-top{display:flex;align-items:flex-start;gap:12px}
.ip-agent{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:88px;padding-top:1px}
.ip-main{flex:1;min-width:0}
.ip-action{font-weight:600;font-size:14px;line-height:1.35}
.ip-detail{color:var(--muted);font-size:13px;margin-top:3px}
.ip-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:0.04em;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.chip.sys{background:var(--panel-2)}
.chip.rev{color:var(--ok);border-color:rgba(63,185,80,0.35)}
.chip.hard{color:var(--watch);border-color:rgba(210,153,34,0.4)}
.ip-read{font-size:11px;color:var(--dim);margin-top:8px}
.ip-read b{color:var(--muted);font-weight:500}
/* confidence */
.conf{margin-top:10px}
.conf-row{display:flex;align-items:center;gap:10px}
.conf-bar{flex:1;height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.conf-fill{height:100%;border-radius:999px;transition:width 300ms var(--ease)}
.conf-val{font-family:var(--mono);font-size:12px;width:38px;text-align:right}
.conf-toggle{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.conf-toggle:hover{color:var(--ink)}
.conf-why{margin-top:8px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);display:none}
.conf-why.open{display:block}
.conf-why li{list-style:none;font-size:12px;color:var(--muted);padding:2px 0 2px 14px;position:relative}
.conf-why li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.below{font-size:11px;color:var(--watch);margin-top:8px;display:flex;align-items:center;gap:6px}
/* actions */
.ip-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line);color:var(--ink);transition:background 120ms var(--ease),border-color 120ms var(--ease)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:rgba(210,153,34,0.5);color:var(--watch)}
.btn.warn:hover{background:rgba(210,153,34,0.08)}
.btn.ghost{color:var(--muted)}
.decline-box{display:none;gap:8px;align-items:center;flex-wrap:wrap;width:100%;margin-top:4px}
.decline-box.open{display:flex}
.decline-box input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;font-size:13px;padding:7px 10px;outline:none}
.decline-box input:focus{border-color:var(--brand)}
/* empty + toast */
.empty{padding:44px 20px;text-align:center}
.empty .ring{width:40px;height:40px;border-radius:50%;border:3px solid var(--ok);margin:0 auto 14px;display:grid;place-items:center;color:var(--ok)}
.empty h3{font-size:15px;font-weight:600;margin-bottom:4px}
.empty p{color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;font-size:13px;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease);z-index:50;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .mono{color:var(--muted);font-size:11px}

/* ---- Rows (queue/feed lists) ---- */
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row .who{font-family:var(--mono);font-size:11px;color:var(--muted);width:76px;flex:none}
.row .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}

/* ---- Small screens: the console is desktop-first but must not break ---- */
.mobile-note{display:none}
@media (max-width: 860px){
  .shell{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .brand{border-right:none}
  .side{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px}
  .side-label{display:none}
  .nav-item{flex:none}
  .topbar{display:none}
  .main{grid-column:1;grid-row:3}
  .cols-3,.cols-2{grid-template-columns:1fr}
  .mobile-note{display:block;font-size:11px;color:var(--dim);padding:8px 2px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <b>Crux</b>
    <span class="mono">Control Room</span>
  </div>
  <div class="topbar">
    <h1 id="screen-title">Overview</h1>
    <span class="crumb" id="screen-crumb">Cobalt Mutual · Ops Analytics</span>
    <div class="top-right">
      <span class="env-chip">Concept Prototype</span>
      <span class="avatar" title="You, the human in charge">FK</span>
    </div>
  </div>
  <nav class="side" id="sidenav" aria-label="Console navigation"></nav>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* =====================================================================
   Crux Control Room, single-file concept prototype.
   Phase 1: shell, tokens, router, canon store, five navigable screens.
   Spec: CONTROL-ROOM.md at repo root. Keep canon counts consistent:
   5 agents, 12 queue items, 1 active incident, 3 escalations this week.
   ===================================================================== */

/* ---------- Canon store (single source of truth) ---------- */
const STORE = {
  bank: "Cobalt Mutual",
  team: "Ops Analytics",
  agents: [
    { id:"recon",    name:"Recon",    job:"Reconciles daily transaction ledgers, flags breaks",          autonomy:"auto",    status:"ok",    dot:"b-ok"    },
    { id:"sentinel", name:"Sentinel", job:"Watches transactions for fraud patterns",                     autonomy:"approve", status:"act",   dot:"b-act"   },
    { id:"reporter", name:"Reporter", job:"Drafts the daily ops brief and regulator-ready summaries",    autonomy:"suggest", status:"ok",    dot:"b-ok"    },
    { id:"quality",  name:"Quality",  job:"Monitors data pipelines, proposes schema fixes",              autonomy:"approve", status:"watch", dot:"b-watch" },
    { id:"forecast", name:"Forecast", job:"Projects liquidity and volume, flags anomalies vs forecast",  autonomy:"suggest", status:"ok",    dot:"b-ok"    },
  ],
  // Items waiting on a human. queueCount is derived from this length everywhere.
  confThreshold: 70,       // below this, the UI forces escalation (Confidence Signal)
  queue: [
    { id:"q1",  agent:"sentinel", action:"Freeze card ending 4471 for 24 hours",        detail:"Velocity rule v4 and geo-jump both tripped on 3 transactions in 6 minutes.", systems:["Cards","Ledger"],            reversible:true,  conf:88, why:["Velocity + geo-jump both fired","Cardholder in known-good travel corridor: no"], read:"3 txns · card history · velocity rule v4" },
    { id:"q2",  agent:"sentinel", action:"Flag merchant MID-90233 for manual review",    detail:"Chargeback rate crossed 1.2% over the trailing 7 days.",                    systems:["Fraud Ops"],                 reversible:true,  conf:76, why:["7-day chargeback rate 1.2% (limit 0.9%)","Volume steady, not a spike"], read:"merchant 7-day history · chargeback ledger" },
    { id:"q3",  agent:"quality",  action:"Apply schema fix to the settlements pipeline",  detail:"Adds a nullable settlement_ref column the new rail requires.",                systems:["Data Pipeline","Warehouse"], reversible:false, conf:71, why:["Matches the documented rail spec","No downstream consumer reads the column yet"], read:"rail spec v2 · pipeline DAG · 4 consumers" },
    { id:"q4",  agent:"quality",  action:"Backfill 3 null-rate columns in txn_daily",     detail:"Recompute derived rates for the last 14 partitions.",                        systems:["Warehouse"],                 reversible:true,  conf:83, why:["Source rows are complete","Recompute is idempotent"], read:"txn_daily · 14 partitions · rate defs" },
    { id:"q5",  agent:"recon",    action:"Write off 2 ledger breaks under 500 rupees",     detail:"Sub-threshold breaks that aged past 5 days with no counterparty match.",     systems:["Ledger","GL"],               reversible:false, conf:64, why:["Both under the auto-writeoff limit","No counterparty match found in 5 days"], read:"2 breaks · GL policy · aging report" },
    { id:"q6",  agent:"recon",    action:"Re-run reconciliation for branch 118",          detail:"Overnight batch missed a file; a clean re-run should close it.",              systems:["Ledger"],                    reversible:true,  conf:92, why:["Missing file has now landed","Re-run is a read-then-match, no writes till matched"], read:"branch 118 batch log · file manifest" },
    { id:"q7",  agent:"reporter", action:"Send the 09:00 ops brief to Ops leads",         detail:"Standard daily brief, 6 recipients on the ops distribution list.",           systems:["Email","Reporting"],         reversible:true,  conf:90, why:["All source panels rendered","Distribution list unchanged"], read:"brief draft · distribution list" },
    { id:"q8",  agent:"reporter", action:"Publish regulator summary draft for sign-off",   detail:"Quarterly ops summary; goes to the compliance queue, not to the regulator.", systems:["Reporting","Compliance"],    reversible:false, conf:68, why:["Numbers reconcile to the ledger","One narrative section is thin on context"], read:"quarterly figures · last filing · template" },
    { id:"q9",  agent:"forecast", action:"Raise a liquidity alert for Friday settlement",  detail:"Projected outflow sits near the comfort band for the Friday window.",         systems:["Treasury"],                  reversible:true,  conf:79, why:["Projection within 3% of the band edge","Two large known outflows land Friday"], read:"liquidity model · Friday calendar" },
    { id:"q10", agent:"forecast", action:"Adjust volume forecast +4% for festival week",   detail:"Seasonal uplift the base model underweights.",                               systems:["Forecast Model"],            reversible:true,  conf:74, why:["Last two festival weeks ran +4 to +6%","Base model has no festival feature"], read:"3-year seasonal series · model config" },
    { id:"q11", agent:"quality",  action:"Pause the KYC-docs ingestion job",               detail:"Upstream source is returning malformed records; pause protects the table.",   systems:["Data Pipeline"],             reversible:true,  conf:81, why:["12% of last batch malformed","Table is downstream-critical"], read:"batch error log · schema check" },
    { id:"q12", agent:"sentinel", action:"Add device fingerprint to the watchlist",        detail:"A single device tied to 4 accounts opened in one hour.",                     systems:["Fraud Ops"],                 reversible:true,  conf:85, why:["4 accounts, 1 device, 1 hour","No shared-family signal"], read:"device graph · account open log" },
  ],
  get queueCount(){ return this.queue.length; },
  cleared: [],             // approved/declined items move here (feeds Audit in a later phase)
  escalations: { activeNow: 1, thisWeek: 3 },
  feed: [                  // most recent first; relative times only, never dates
    { who:"Recon",    what:"Cleared 1,204 matched entries; 2 breaks parked for review", when:"2m ago"  },
    { who:"Sentinel", what:"ESCALATED: card-present cluster, 7 txns, needs a human call", when:"9m ago" },
    { who:"Quality",  what:"Proposed a schema fix for the settlements pipeline",          when:"14m ago" },
    { who:"Reporter", what:"Drafted the 09:00 ops brief, waiting on your review",         when:"31m ago" },
    { who:"Forecast", what:"Liquidity projection updated; within expected band",          when:"48m ago" },
  ],
};
const AUTONOMY_LABEL = { suggest:"Suggest only", approve:"Approve each", auto:"Auto with audit" };

/* ---------- Router ---------- */
const ROUTES = [
  { hash:"#/overview",   nav:"Overview",   glyph:"◉", title:"Overview" },
  { hash:"#/review",     nav:"Review",     glyph:"☑", title:"Review Queue",  badge:() => STORE.queueCount },
  { hash:"#/audit",      nav:"Audit",      glyph:"≣", title:"Action Audit" },
  { hash:"#/escalation", nav:"Escalation", glyph:"▲", title:"Escalation",    badge:() => STORE.escalations.activeNow, hot:true },
];
function currentRoute(){
  const h = location.hash || "#/overview";
  if (h.startsWith("#/agent/")) return { hash:h, title:"Agent", agentId:h.split("/")[2] };
  return ROUTES.find(r => r.hash === h) || ROUTES[0];
}

/* ---------- Renderers ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderNav(){
  const r = currentRoute();
  const items = ROUTES.map(x => `
    <a class="nav-item ${x.hash===r.hash ? "active":""}" href="${x.hash}">
      <span class="glyph" aria-hidden="true">${x.glyph}</span>${x.nav}
      ${x.badge ? `<span class="nav-badge ${x.hot?"hot":""}">${x.badge()}</span>` : ""}
    </a>`).join("");
  const agents = STORE.agents.map(a => `
    <a class="nav-item ${r.agentId===a.id ? "active":""}" href="#/agent/${a.id}">
      <span class="agent-dot ${a.dot}" aria-hidden="true"></span>${a.name}
      <span class="nav-badge">${AUTONOMY_LABEL[a.autonomy].split(" ")[0]}</span>
    </a>`).join("");
  $("#sidenav").innerHTML = `${items}<div class="side-label">Agent Fleet</div>${agents}`;
}

function screenOverview(){
  const fleet = STORE.agents.map(a => `
    <a class="row" href="#/agent/${a.id}" style="text-decoration:none">
      <span class="agent-dot ${a.dot}"></span>
      <span class="who">${a.name}</span>
      <span class="what">${esc(a.job)}</span>
      <span class="pill">${AUTONOMY_LABEL[a.autonomy]}</span>
    </a>`).join("");
  const feed = STORE.feed.map(f => `
    <div class="row">
      <span class="who">${f.who}</span>
      <span class="what ${f.what.startsWith("ESCALATED") ? "s-act":""}">${esc(f.what)}</span>
      <span class="when">${f.when}</span>
    </div>`).join("");
  return `
    <div class="grid cols-3">
      <div class="panel kpi"><span class="v">${STORE.agents.length}</span><span class="l">Agents on the floor</span></div>
      <div class="panel kpi"><span class="v">${STORE.queueCount}</span><span class="l">Waiting on you</span></div>
      <div class="panel kpi"><span class="v s-act">${STORE.escalations.activeNow}</span><span class="l">Active escalation · ${STORE.escalations.thisWeek} this week</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Agent Fleet</h2><span class="mono">autonomy is per agent, per action class</span></div>
      ${fleet}
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Activity</h2><span class="mono">live feed</span></div>
      ${feed}
    </div>`;
}

function screenAgent(id){
  const a = STORE.agents.find(x => x.id === id);
  if (!a) return `<div class="panel stub">Unknown agent.</div>`;
  return `
    <div class="panel">
      <div class="panel-h"><h2>${a.name}</h2><span class="pill"><span class="dot ${a.dot}"></span>${AUTONOMY_LABEL[a.autonomy]}</span></div>
      <div class="panel-b" style="color:var(--muted)">${esc(a.job)}.</div>
    </div>
    <div class="panel stub"><span class="mono">Phase 3</span>Autonomy Dial, action classes, and this agent's decision history render here.</div>`;
}

const STUBS = {
  "#/audit":      ["Phase 3", "The immutable action log renders here: filters, before/after diffs, incident replay."],
  "#/escalation": ["Phase 3", "Sentinel's context package renders here: what it tried, what it knows, what it recommends, and your one-click paths."],
};

const agentById = (id) => STORE.agents.find(a => a.id === id) || { name:id, dot:"b-info" };

/* ---------- Trust pattern 1: Intent Preview / Review Queue ---------- */
function intentCard(it){
  const a = agentById(it.agent);
  const below = it.conf < STORE.confThreshold;
  const primary = below
    ? `<button class="btn warn" onclick="escalateItem('${it.id}')">Escalate to review</button>`
    : `<button class="btn primary" onclick="approveItem('${it.id}')">Approve</button>`;
  return `
  <div class="ip" data-id="${it.id}">
    <div class="ip-top">
      <div class="ip-agent"><span class="agent-dot ${a.dot}"></span>${a.name}</div>
      <div class="ip-main">
        <div class="ip-action">${esc(it.action)}</div>
        <div class="ip-detail">${esc(it.detail)}</div>
        <div class="ip-meta">
          ${it.systems.map(s => `<span class="chip sys">${esc(s)}</span>`).join("")}
          <span class="chip ${it.reversible ? "rev":"hard"}">${it.reversible ? "Reversible" : "Hard to reverse"}</span>
        </div>
        <div class="ip-read"><b>Read to decide:</b> ${esc(it.read)}</div>
        <div class="conf">
          <div class="conf-row">
            <span class="mono" style="font-size:11px;color:var(--dim)">Confidence</span>
            <div class="conf-bar"><div class="conf-fill" style="width:${it.conf}%;background:var(--info)"></div></div>
            <span class="conf-val">${it.conf}%</span>
            <button class="conf-toggle" onclick="toggleWhy('${it.id}')">why</button>
          </div>
          <ul class="conf-why" id="why-${it.id}">${it.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
          ${below ? `<div class="below"><span>&#9650;</span> Below your ${STORE.confThreshold}% escalation threshold. It cannot be auto-approved; a human has to make this call.</div>` : ""}
        </div>
      </div>
    </div>
    <div class="ip-actions">
      ${primary}
      <button class="btn ghost" onclick="openDecline('${it.id}')">Decline</button>
      <div class="decline-box" id="dec-${it.id}">
        <input type="text" id="reason-${it.id}" placeholder="Reason (the agent factors this into future proposals)" onkeydown="if(event.key==='Enter')confirmDecline('${it.id}')">
        <button class="btn warn" onclick="confirmDecline('${it.id}')">Decline with reason</button>
      </div>
    </div>
  </div>`;
}

function screenReview(){
  if (!STORE.queue.length){
    return `<div class="panel empty">
      <div class="ring">&#10003;</div>
      <h3>Queue clear.</h3>
      <p>Every pending action has a human decision on it. New proposals will land here.</p>
    </div>`;
  }
  return `
    <div class="review-head">
      <h2>Review Queue</h2>
      <span class="mono">${STORE.queue.length} items &middot; each card is what an agent intends to do, before it acts</span>
    </div>
    ${STORE.queue.map(intentCard).join("")}`;
}

/* interactions (single source of truth: mutate STORE.queue, then re-render) */
window.toggleWhy = (id) => {
  const el = document.getElementById("why-" + id);
  if (el) el.classList.toggle("open");
};
function resolveItem(id, decision, reason){
  const i = STORE.queue.findIndex(x => x.id === id);
  if (i < 0) return null;
  const [item] = STORE.queue.splice(i, 1);
  STORE.cleared.unshift({ ...item, decision, reason: reason || null, when: "just now" });
  if (decision === "escalated") STORE.escalations.activeNow += 1;
  return item;
}
function animateOutThenRender(id, after){
  const card = document.querySelector(`.ip[data-id="${id}"]`);
  const go = () => { after(); render(); };
  if (!card || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return go();
  card.classList.add("leaving");
  setTimeout(go, 200);
};
window.approveItem = (id) => {
  const it = STORE.queue.find(x => x.id === id); if (!it) return;
  const a = agentById(it.agent);
  animateOutThenRender(id, () => resolveItem(id, "approved"));
  toast(`Approved. ${a.name} will act now.`, "Logged to the action audit.");
};
window.escalateItem = (id) => {
  animateOutThenRender(id, () => resolveItem(id, "escalated"));
  toast("Escalated. It is now on the Escalation screen.", "Low confidence needs a human call.");
};
window.openDecline = (id) => {
  const box = document.getElementById("dec-" + id);
  if (box){ box.classList.add("open"); const inp = document.getElementById("reason-" + id); if (inp) inp.focus(); }
};
window.confirmDecline = (id) => {
  const inp = document.getElementById("reason-" + id);
  const reason = (inp && inp.value.trim()) || "";
  if (!reason){ if (inp){ inp.focus(); inp.style.borderColor = "var(--act)"; } return; }
  const it = STORE.queue.find(x => x.id === id); const a = it ? agentById(it.agent) : { name:"The agent" };
  animateOutThenRender(id, () => resolveItem(id, "declined", reason));
  toast(`Declined. ${a.name} will factor that into future proposals.`, `"${reason}"`);
};

/* toast */
let toastTimer;
function toast(msg, sub){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `${esc(msg)}${sub ? ` <span class="mono">${esc(sub)}</span>` : ""}`;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function render(){
  const r = currentRoute();
  renderNav();
  let html;
  if (r.agentId) html = screenAgent(r.agentId);
  else if (r.hash === "#/overview") html = screenOverview();
  else if (r.hash === "#/review") html = screenReview();
  else { const s = STUBS[r.hash]; html = `<div class="panel stub"><span class="mono">${s[0]}</span>${s[1]}</div>`; }
  const agent = r.agentId ? STORE.agents.find(x=>x.id===r.agentId) : null;
  $("#screen-title").textContent = agent ? agent.name : r.title;
  $("#screen-crumb").textContent = `${STORE.bank} · ${STORE.team}`;
  $("#main").innerHTML = `
    <div class="screen">
      <p class="mobile-note">Best experienced on desktop; this console is data-dense by design.</p>
      ${html}
      <div class="foot-note">
        <b>Why this exists:</b> a working study of the five agent-trust patterns (intent preview, autonomy dial,
        confidence, audit, escalation) for Crux, an AI decision-intelligence concept. Reconstructed from secondary
        research; no primary research conducted. All data is fictional.
      </div>
    </div>`;
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
