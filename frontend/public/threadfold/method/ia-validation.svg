<svg style="width:100%;background:#F8F7F3;border-radius:12px;" viewBox="0 0 1080 520" xmlns="http://www.w3.org/2000/svg">
<style>text{font-family:Inter,-apple-system,sans-serif}
.t{font-size:15px;font-weight:700;fill:#171512}
.s{font-size:11.5px;font-weight:700;fill:#96420C;letter-spacing:.07em}
.l{font-size:11.5px;fill:#6B665D}
.n{font-size:12px;fill:#171512}
.b{font-size:12px;font-weight:600;fill:#171512}
.w{font-size:11.5px;fill:#fff}
.wb{font-size:12px;font-weight:600;fill:#fff}
.num{font-size:26px;font-weight:700;fill:#96420C}
.axis{stroke:#D8D5CC;stroke-width:1.2}
.dash{stroke:#96420C;stroke-width:1.3;stroke-dasharray:5 4;fill:none}</style>

<text class="s" x="30" y="34">IA VALIDATION</text>
<text class="t" x="30" y="56">Card sort, then tree test, then first click</text>
<text class="l" x="30" y="84">48 participants sorted 34 content cards. The structure that came out was tested for findability</text>
<text class="l" x="30" y="101">before a single screen was designed.</text>

<text class="s" x="30" y="146">TREE TEST · TASK SUCCESS</text>

<text class="b" x="30" y="162">First structure, grouped by our internal teams</text>
<rect x="30" y="172" width="560" height="26" rx="6" fill="#fff" stroke="#D8D5CC"/>
<rect x="30" y="172" width="291.2" height="26" rx="6" fill="#D9CFC4"/>
<text class="b" x="42" y="190">52%</text>
<text class="l" x="604" y="190">misses</text>

<text class="b" x="30" y="234">Regrouped around three user jobs</text>
<rect x="30" y="244" width="560" height="26" rx="6" fill="#fff" stroke="#D8D5CC"/>
<rect x="30" y="244" width="453.6" height="26" rx="6" fill="#96420C"/>
<text class="wb" x="42" y="262">81%</text>
<text class="l" x="604" y="262">clears</text>
<line class="dash" x1="450" y1="150" x2="450" y2="282"/>
<text class="s" x="458" y="146">75% TARGET</text>

<text class="s" x="30" y="330">FIRST-CLICK TEST · CORRECT FIRST CLICK</text>

<text class="b" x="30" y="346">Before</text>
<rect x="30" y="356" width="560" height="26" rx="6" fill="#fff" stroke="#D8D5CC"/>
<rect x="30" y="356" width="246.4" height="26" rx="6" fill="#D9CFC4"/>
<text class="b" x="42" y="374">44%</text>
<text class="l" x="604" y="374"></text>

<text class="b" x="30" y="414">After</text>
<rect x="30" y="424" width="560" height="26" rx="6" fill="#fff" stroke="#D8D5CC"/>
<rect x="30" y="424" width="436.8" height="26" rx="6" fill="#96420C"/>
<text class="wb" x="42" y="442">78%</text>
<text class="l" x="604" y="442"></text>

<rect x="700" y="140" width="350" height="300" rx="12" fill="#F3E7DD"/>
<text class="s" x="726" y="176">WHY FIRST CLICK</text>
<text class="l" x="726" y="202">Users who get their first click right</text>
<text class="l" x="726" y="219">are roughly three times more likely to</text>
<text class="l" x="726" y="236">finish the task at all: 70% against 24%.</text>
<text class="l" x="726" y="288">So the cheapest reliable signal about a</text>
<text class="l" x="726" y="305">navigation change is whether people</text>
<text class="l" x="726" y="322">reach for the right thing once, not</text>
<text class="l" x="726" y="339">whether they eventually recover.</text>
<text class="num" x="726" y="404">3×</text>
<text class="l" x="772" y="404">task success on a correct first click</text>
</svg>