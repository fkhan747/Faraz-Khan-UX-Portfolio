<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux · Control Room</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%234A154B'/><circle cx='50' cy='50' r='22' fill='none' stroke='%232EB67D' stroke-width='9'/><circle cx='50' cy='50' r='5' fill='%23FFFFFF'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
<style>
/* ================= Crux Control Room, design tokens (LOCKED, see CONTROL-ROOM.md 3e) ================= */
:root{
  /* Slack Design System (light). Surfaces */
  --bg:#F8F8F8; --panel:#FFFFFF; --panel-2:#F4F4F4; --line:#E8E8E8;
  --sidebar:#4A123E;               /* $core_primary, Slack sidebar aubergine */
  /* Text ink */
  --ink:#1D1C1D; --muted:#616061; --dim:#868686;
  /* Brand accent: Slack aubergine */
  --brand:#4A154B;                 /* $core_primary_brand */
  /* Status (logo hues; use as dots/fills. Darker text variants live in the theme block) */
  --ok:#2EB67D; --watch:#ECB22E; --act:#E01E5A; --info:#1264A3;
  /* Type: two-font system, Figtree body + Playfair Display titles */
  --sans:'Figtree',system-ui,-apple-system,sans-serif;
  --mono:'Figtree',system-ui,-apple-system,sans-serif;
  --display:'Playfair Display',Georgia,serif;
  --r:6px; --ease:cubic-bezier(0.2,0.7,0.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::selection{background:rgba(232,81,155,0.35)}

/* ---- App shell: fixed sidebar + topbar + main ---- */
.shell{display:grid;grid-template-columns:360px 1fr;grid-template-rows:52px 1fr;height:100vh}
.brand{grid-column:1;grid-row:1;display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.brand-mark{width:20px;height:20px;border-radius:50%;border:5px solid var(--brand);flex:none}
.brand b{font-weight:700;letter-spacing:-0.01em}
.brand .mono{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.14em;margin-left:auto}
.topbar{grid-column:2;grid-row:1;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line)}
.topbar h1{font-size:14px;font-weight:600}
.topbar .crumb{color:var(--muted);font-size:12px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.env-chip{font-family:var(--mono);font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#3d2b3f,#22303f);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--mono);font-size:10px;color:var(--ink)}

.side{grid-column:1;grid-row:2;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.side-label{font-family:var(--mono);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;color:var(--dim);padding:10px 8px 6px}
.nav-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:7px 10px;border-radius:var(--r);color:var(--muted);font-weight:500;font-size:13px;text-decoration:none;transition:background 140ms var(--ease),color 140ms var(--ease)}
.nav-item:hover{background:var(--panel);color:var(--ink)}
.nav-item.active{background:var(--panel-2);color:var(--ink)}
.nav-item .glyph{width:16px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--dim)}
.nav-item.active .glyph{color:var(--brand)}
.nav-badge{margin-left:auto;font-family:var(--mono);font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.nav-badge.hot{border-color:rgba(248,81,73,0.5);color:var(--act)}
.agent-dot{width:7px;height:7px;border-radius:50%;flex:none}

.main{grid-column:2;grid-row:2;overflow-y:auto;padding:20px;scroll-behavior:smooth}
.screen{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px;animation:screen-in 200ms var(--ease)}
@keyframes screen-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---- Primitives ---- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.panel-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:12px;font-weight:600;letter-spacing:0.02em}
.panel-h .mono{font-size:10px;color:var(--dim)}
.panel-b{padding:14px}
.grid{display:grid;gap:16px}
.cols-3{grid-template-columns:repeat(3,1fr)}
.cols-2{grid-template-columns:repeat(2,1fr)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill .dot{width:6px;height:6px;border-radius:50%}
.s-ok{color:var(--ok)} .s-watch{color:var(--watch)} .s-act{color:var(--act)} .s-info{color:var(--info)}
.b-ok{background:var(--ok)} .b-watch{background:var(--watch)} .b-act{background:var(--act)} .b-info{background:var(--info)}
.kpi{display:flex;flex-direction:column;gap:2px;padding:14px}
.kpi .v{font-family:var(--mono);font-size:26px;font-weight:600;line-height:1.1}
.kpi .l{font-size:11px;color:var(--muted)}
.stub{padding:36px 20px;text-align:center;color:var(--dim);font-size:13px}
.stub .mono{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;margin-bottom:8px;color:var(--brand)}
.foot-note{max-width:1180px;margin:26px auto 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--dim);font-size:11px;display:flex;gap:8px;flex-wrap:wrap}
.foot-note b{color:var(--muted);font-weight:600}

/* ---- Intent Preview cards (trust pattern 1) ---- */
.review-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.review-head h2{font-size:15px;font-weight:600}
.review-head .mono{font-size:11px;color:var(--muted)}
.ip{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr;gap:12px;transition:border-color 140ms var(--ease),opacity 200ms var(--ease),transform 200ms var(--ease)}
.ip.leaving{opacity:0;transform:translateX(10px)}
.ip-top{display:flex;align-items:flex-start;gap:12px}
.ip-agent{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:11px;color:var(--muted);flex:none;width:88px;padding-top:1px}
.ip-main{flex:1;min-width:0}
.ip-action{font-weight:600;font-size:14px;line-height:1.35}
.ip-detail{color:var(--muted);font-size:13px;margin-top:3px}
.ip-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;align-items:center}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:0.04em;padding:2px 8px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.chip.sys{background:var(--panel-2)}
.chip.rev{color:var(--ok);border-color:rgba(63,185,80,0.35)}
.chip.hard{color:var(--watch);border-color:rgba(210,153,34,0.4)}
.ip-read{font-size:11px;color:var(--dim);margin-top:8px}
.ip-read b{color:var(--muted);font-weight:500}
/* confidence */
.conf{margin-top:10px}
.conf-row{display:flex;align-items:center;gap:10px}
.conf-bar{flex:1;height:6px;border-radius:999px;background:var(--panel-2);overflow:hidden;border:1px solid var(--line)}
.conf-fill{height:100%;border-radius:999px;transition:width 300ms var(--ease)}
.conf-val{font-family:var(--mono);font-size:12px;width:38px;text-align:right}
.conf-toggle{font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
.conf-toggle:hover{color:var(--ink)}
.conf-why{margin-top:8px;padding:8px 10px;background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);display:none}
.conf-why.open{display:block}
.conf-why li{list-style:none;font-size:12px;color:var(--muted);padding:2px 0 2px 14px;position:relative}
.conf-why li::before{content:"";position:absolute;left:2px;top:8px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.below{font-size:11px;color:var(--watch);margin-top:8px;display:flex;align-items:center;gap:6px}
/* actions */
.ip-actions{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.btn{font-family:var(--sans);font-size:12px;font-weight:600;padding:7px 14px;border-radius:var(--r);border:1px solid var(--line);color:var(--ink);transition:background 120ms var(--ease),border-color 120ms var(--ease)}
.btn:hover{background:var(--panel-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:rgba(210,153,34,0.5);color:var(--watch)}
.btn.warn:hover{background:rgba(210,153,34,0.08)}
.btn.ghost{color:var(--muted)}
.decline-box{display:none;gap:8px;align-items:center;flex-wrap:wrap;width:100%;margin-top:4px}
.decline-box.open{display:flex}
.decline-box input{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r);color:var(--ink);font:inherit;font-size:13px;padding:7px 10px;outline:none}
.decline-box input:focus{border-color:var(--brand)}
/* empty + toast */
.empty{padding:44px 20px;text-align:center}
.empty .ring{width:40px;height:40px;border-radius:50%;border:3px solid var(--ok);margin:0 auto 14px;display:grid;place-items:center;color:var(--ok)}
.empty h3{font-size:15px;font-weight:600;margin-bottom:4px}
.empty p{color:var(--muted);font-size:13px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px 16px;font-size:13px;color:var(--ink);box-shadow:0 8px 30px rgba(0,0,0,0.5);opacity:0;pointer-events:none;transition:opacity 180ms var(--ease),transform 180ms var(--ease);z-index:50;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .mono{color:var(--muted);font-size:11px}

/* ---- Rows (queue/feed lists) ---- */
.row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-bottom:1px solid var(--line);font-size:13px}
.row:last-child{border-bottom:none}
.row .who{font-family:var(--mono);font-size:11px;color:var(--muted);width:76px;flex:none}
.row .what{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .when{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}

/* ---- Autonomy Dial + routing lanes (trust pattern 2) ---- */
.panel-h h2{margin-right:2px}
.dial{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--bg)}
.dial-seg{padding:8px 16px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line);transition:background 140ms var(--ease),color 140ms var(--ease)}
.dial-seg:last-child{border-right:none}
.dial-seg:hover{color:var(--ink);background:var(--panel-2)}
.dial-seg.on{background:var(--brand);color:#fff}
.dial-rec{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:0.06em;text-transform:uppercase;color:var(--info)}
.dial-desc{margin-top:10px;color:var(--muted);font-size:13px;max-width:64ch}
.lanes{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.lane{padding:12px 14px;border-right:1px solid var(--line)}
.lane:last-child{border-right:none}
.lane-h{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lane-title{font-size:11px;font-family:var(--mono);letter-spacing:0.1em;text-transform:uppercase;color:var(--dim)}
.lane-n{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 7px}
.lane-empty{color:var(--dim);font-size:12px;padding:6px 0;max-width:44ch}
.lane-item{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;animation:lane-in 260ms var(--ease)}
.lane-item:last-child{border-bottom:none}
@keyframes lane-in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.li-act{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-tag{font-family:var(--mono);font-size:11px;color:var(--dim);flex:none}
.li-tag.held{color:var(--watch)}

/* ---- decision badge (shared by Audit + agent history) ---- */
.dec{font-family:var(--mono);font-size:10px;letter-spacing:0.04em;text-transform:uppercase;padding:2px 8px;border-radius:4px;border:1px solid currentColor;flex:none;opacity:0.9}

/* ---- Action Audit (trust pattern 4) ---- */
.fbar{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 12px;transition:color 140ms var(--ease),border-color 140ms var(--ease)}
.fchip:hover{color:var(--ink)}
.fchip.on{color:var(--ink);border-color:var(--brand)}
.fchip-n{font-family:var(--mono);font-size:10px;color:var(--dim)}
.arow{border-bottom:1px solid var(--line)}
.arow:last-child{border-bottom:none}
.arow-main{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 14px;font-size:13px;transition:background 120ms var(--ease)}
.arow-main:hover{background:var(--panel-2)}
.arow-caret{font-family:var(--mono);color:var(--dim);flex:none;transition:transform 160ms var(--ease)}
.arow.open .arow-caret{transform:rotate(90deg)}
.arow-detail{display:none;padding:2px 14px 14px 102px}
.arow.open .arow-detail{display:block}
.diff{border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.diff-row{display:flex;align-items:center;gap:10px;padding:8px 12px;font-family:var(--mono);font-size:12px}
.diff-row+.diff-row{border-top:1px solid var(--line)}
.diff-tag{font-size:10px;text-transform:uppercase;letter-spacing:0.06em;padding:1px 0;border-radius:3px;flex:none;width:52px;text-align:center}
.diff-tag.before{background:rgba(248,81,73,0.12);color:var(--act)}
.diff-tag.after{background:rgba(63,185,80,0.12);color:var(--ok)}
.diff-v{color:var(--muted)}
.areason{margin-top:10px;font-size:13px;color:var(--muted)}
.areason b{color:var(--ink);font-weight:600}

/* ---- Incident replay ---- */
.rp-ctrl{margin-left:auto;display:flex;gap:6px}
.btn[disabled]{opacity:0.4;cursor:default}
.rp{display:flex;flex-direction:column}
.rp-step{display:flex;align-items:center;gap:12px;padding:8px 0;opacity:0.38;transition:opacity 220ms var(--ease)}
.rp-step.on{opacity:1}
.rp-t{font-size:11px;color:var(--dim);width:72px;flex:none}
.rp-dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none;transition:background 200ms var(--ease)}
.rp-step.on .rp-dot{background:var(--info)}
.rp-step.cur .rp-dot{background:var(--brand);box-shadow:0 0 0 4px rgba(232,81,155,0.18)}
.rp-e{font-size:13px}

/* ---- Escalation Pathway (trust pattern 5) ---- */
.esc{padding:16px}
.esc-head{display:flex;align-items:center;gap:12px}
.esc-head .agent-dot{width:9px;height:9px}
.esc-head-t{flex:1;min-width:0}
.esc-title{font-size:16px;font-weight:600;line-height:1.3}
.esc-sub{font-size:11px;color:var(--dim);margin-top:2px}
.esc-summary{color:var(--muted);font-size:13px;margin:12px 0;max-width:76ch}
.esc-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:6px 0 14px}
.esc-block h4{font-size:11px;font-family:var(--mono);letter-spacing:0.08em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.esc-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.esc-list li{font-size:13px;color:var(--muted);padding-left:14px;position:relative}
.esc-list li::before{content:"";position:absolute;left:2px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--dim)}
.kvs{display:flex;flex-direction:column;gap:6px}
.kv{display:flex;gap:10px;font-size:13px}
.kv-k{font-family:var(--mono);font-size:11px;color:var(--dim);width:92px;flex:none;padding-top:1px}
.kv-v{color:var(--muted)}
.esc-rec{border:1px solid var(--line);border-left:2px solid var(--brand);border-radius:var(--r);padding:12px 14px;background:var(--panel-2)}
.esc-rec-l{display:flex;align-items:center;gap:10px;margin-bottom:5px}
.esc-rec-l .mono{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--brand)}
.conf-mini{font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto}
.esc-rec p{font-size:14px}
.esc-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

/* ---- Small screens: the console is desktop-first but must not break ---- */
.mobile-note{display:none}
@media (max-width: 860px){
  .shell{grid-template-columns:1fr;grid-template-rows:52px auto 1fr}
  .brand{border-right:none}
  .side{grid-column:1;grid-row:2;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px}
  .side-label{display:none}
  .nav-item{flex:none}
  .topbar{display:none}
  .main{grid-column:1;grid-row:3}
  .cols-3,.cols-2{grid-template-columns:1fr}
  .lanes,.esc-cols{grid-template-columns:1fr}
  .lane{border-right:none;border-bottom:1px solid var(--line)}
  .lane:last-child{border-bottom:none}
  .arow-detail{padding-left:14px}
  .dial{width:100%}
  .dial-seg{flex:1;text-align:center;padding:8px 6px}
  .mobile-note{display:block;font-size:11px;color:var(--dim);padding:8px 2px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}

/* ============================================================
   SLACK THEME (light) - palette from the Slack Design System.
   Aubergine sidebar, white content, Playfair titles + Figtree body.
   This block overrides the base rules above via source order.
   ============================================================ */
::selection{background:rgba(74,21,75,0.16)}

/* Playfair Display on titles only; data/numbers stay Figtree tabular-nums */
#screen-title,.review-head h2,.esc-title,.empty h3,.brand b{
  font-family:var(--display);font-weight:700;letter-spacing:-0.005em;line-height:1.18;
}
.kpi .v,.conf-val,.conf-mini,.rp-t,.lane-n,.num,.mono{font-family:var(--sans);font-variant-numeric:tabular-nums}

/* Status TEXT darkened for AA on white (dots/fills keep the bright logo hues) */
.s-ok{color:#1A7F52}
.s-watch{color:#8A6D00}
.s-act{color:#C31C4E}
.s-info{color:#1264A3}
.below{color:#8A6D00}
.li-tag.held{color:#8A6D00}
.chip.rev{color:#1A7F52;border-color:rgba(46,182,125,0.5)}
.chip.hard{color:#8A6D00;border-color:rgba(236,178,46,0.6)}
.btn.warn{border-color:rgba(236,178,46,0.65);color:#8A6D00}
.btn.warn:hover{background:rgba(236,178,46,0.12)}
.dial-rec{color:#1264A3}
.diff-tag.before{background:rgba(224,30,90,0.10);color:#C31C4E}
.diff-tag.after{background:rgba(46,182,125,0.14);color:#1A7F52}
.b-ok{box-shadow:inset 0 0 0 1px rgba(26,127,82,0.55)}
.b-watch{box-shadow:inset 0 0 0 1px rgba(138,109,0,0.6)}

/* Light-theme elevation + surfaces */
.avatar{background:linear-gradient(135deg,#EFE3EF,#E6E9F0);color:var(--ink);border-color:var(--line)}
.toast{box-shadow:0 8px 24px rgba(15,20,25,0.14)}
.rp-step.cur .rp-dot{box-shadow:0 0 0 4px rgba(74,21,75,0.16)}
.conf-bar{background:#E8E8E8}
.topbar{background:#FFFFFF}
.main{background:var(--bg)}

/* ---- Aubergine sidebar: the iconic Slack element ---- */
.brand,.side{background:var(--sidebar)}
.brand{border-right-color:rgba(255,255,255,0.14);border-bottom-color:rgba(255,255,255,0.14)}
.brand b{color:#FFFFFF}
.brand .mono{color:rgba(255,255,255,0.6)}
.brand-mark{border-color:#ECB22E}
.side{border-right-color:rgba(255,255,255,0.14)}
.side-label{color:rgba(255,255,255,0.5)}
.nav-item{color:rgba(255,255,255,0.8)}
.nav-item:hover{background:rgba(255,255,255,0.08);color:#FFFFFF}
.nav-item.active{background:#1264A3;color:#FFFFFF}
.nav-item .glyph{color:rgba(255,255,255,0.55)}
.nav-item.active .glyph{color:#FFFFFF}
.nav-badge{border-color:rgba(255,255,255,0.28);color:rgba(255,255,255,0.78)}
.nav-badge.hot{background:#E01E5A;border-color:#E01E5A;color:#FFFFFF}

/* ---- Material Symbols (Rounded) icons ---- */
.msr{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:18px;line-height:1;
  letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;
  -webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20}
/* nav icons (override the old .glyph mono treatment) */
.nav-item .glyph{font-family:'Material Symbols Rounded';font-size:20px;width:22px;line-height:1;
  font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 20;
  -webkit-font-feature-settings:'liga';font-feature-settings:'liga'}
.nav-item.active .glyph{font-variation-settings:'FILL' 1,'wght' 500,'GRAD' 0,'opsz' 20}
/* agent fleet role icons, tinted by health */
.agent-ico{font-size:18px;flex:none;width:20px;text-align:center}
.agent-ico.ag-ok{color:#1A7F52}
.agent-ico.ag-watch{color:#8A6D00}
.agent-ico.ag-act{color:#C31C4E}
.side .agent-ico.ag-ok{color:#2EB67D}
.side .agent-ico.ag-watch{color:#ECB22E}
.side .agent-ico.ag-act{color:#FF6392}

/* =====================================================================
   POLISH PASS (design punch-list + consistency)
   ===================================================================== */
/* soft, hue-tinted elevation on cards (no pure-black shadows) */
.panel{box-shadow:0 1px 2px rgba(29,28,29,0.05)}

/* 1. KPI cards: three gradients, white readouts, larger numbers */
.kpi{border:none;border-radius:12px;padding:18px 20px;gap:6px}
.kpi.k1{background:linear-gradient(135deg,#1E328F,#1264A3)}
.kpi.k2{background:linear-gradient(135deg,#4A154B,#7C2852)}
.kpi.k3{background:linear-gradient(135deg,#B01247,#E01E5A)}
.kpi .v{color:#fff;font-size:34px;font-weight:700}
.kpi .l{color:rgba(255,255,255,0.88);font-size:12px}

/* 2. Section/panel headers: Playfair, larger than body, aubergine */
.panel-h{padding:13px 18px}
.panel-h h2{font-family:var(--display);font-size:17px;font-weight:700;color:#4A154B;letter-spacing:-0.005em;margin-right:4px}
.review-head h2,.esc-title{color:#4A154B}
.review-head h2{font-size:20px}

/* 3. Brand wordmark, clearly large */
.brand{gap:11px;padding:0 18px}
.brand b{font-size:23px;line-height:1}
.brand .mono{font-size:9px;letter-spacing:0.16em}

/* 4. Sidebar nav: more legible, roomier */
.side{padding:14px 12px}
.side-label{color:rgba(255,255,255,0.55);padding:14px 10px 6px}
.nav-item{font-size:14px;padding:9px 12px;color:rgba(255,255,255,0.86)}
.nav-item:hover{color:#fff}

/* 5. Autonomy pills: colour-coded, not bland */
.pill.au-suggest{background:#EAF1FB;color:#1264A3;border-color:#CBDFF4}
.pill.au-approve{background:#F5EAF3;color:#7C2852;border-color:#E6D0E1}
.pill.au-auto{background:#E7F6EF;color:#1A7F52;border-color:#C6E8D6}
.nav-badge.au-suggest{color:#8FC7F5;border-color:rgba(143,199,245,0.42)}
.nav-badge.au-approve{color:#E9A9CE;border-color:rgba(233,169,206,0.42)}
.nav-badge.au-auto{color:#7FD9AC;border-color:rgba(127,217,172,0.42)}

/* 6. Primary Approve button = Slack green (distinct from aubergine chrome) */
.btn.primary{background:#007A5A;border-color:#007A5A;color:#fff}
.btn.primary:hover{background:#148567;border-color:#148567;filter:none}

/* 7. Audit filter chips: aligned, visible counts */
.fbar{gap:8px;align-items:center;margin-bottom:4px}
.fchip{align-items:center;gap:8px;padding:6px 8px 6px 13px;border-radius:999px}
.fchip-n{font-size:11px;font-weight:600;color:#616061;background:#ECECEC;border-radius:999px;padding:1px 8px;min-width:20px;text-align:center}
.fchip.on{border-color:#4A154B;color:#4A154B}
.fchip.on .fchip-n{background:#4A154B;color:#fff}

/* 8. Intent cards: content left-aligned, agent tag + actions on the right */
.ip{gap:9px;padding:16px 18px}
.ip-head{display:flex;align-items:flex-start;gap:14px}
.ip-action{flex:1;min-width:0;font-weight:600;font-size:15px;line-height:1.35;color:var(--ink)}
.ip-agent-tag{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 8px}
.ip-agent-tag .agent-ico{font-size:15px;width:auto}
.ip-detail,.ip-meta,.ip-read,.conf{margin-top:0}
.conf-lbl{font-size:11px;color:var(--dim);font-weight:500;flex:none}
.ip-actions{justify-content:flex-end}

/* 9. Audit rows: typographic hierarchy (action leads, agent is a label) */
.arow-main{gap:14px;padding:11px 16px}
.ar-agent{display:inline-flex;align-items:center;gap:8px;width:118px;flex:none}
.arow-main .who{width:auto;font-size:12px;color:var(--muted)}
.arow-main .what{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow-caret{font-size:20px;color:var(--dim);width:auto}
/* 10. expanded diff aligns from the left (no dead left space) */
.arow-detail{padding:2px 16px 14px 16px}
.diff{max-width:640px}
</style>
</head>
<body>
<div class="shell">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <b>Crux</b>
    <span class="mono">Control Room</span>
  </div>
  <div class="topbar">
    <h1 id="screen-title">Overview</h1>
    <span class="crumb" id="screen-crumb">Cobalt Mutual · Ops Analytics</span>
    <div class="top-right">
      <span class="env-chip">Concept Prototype</span>
      <span class="avatar" title="You, the human in charge">FK</span>
    </div>
  </div>
  <nav class="side" id="sidenav" aria-label="Console navigation"></nav>
  <main class="main" id="main"></main>
</div>

<script>
"use strict";
/* =====================================================================
   Crux Control Room, single-file concept prototype.
   Phase 1: shell, tokens, router, canon store, five navigable screens.
   Spec: CONTROL-ROOM.md at repo root. Keep canon counts consistent:
   5 agents, 12 queue items, 1 active incident, 3 escalations this week.
   ===================================================================== */

/* ---------- Canon store (single source of truth) ---------- */
const STORE = {
  bank: "Cobalt Mutual",
  team: "Ops Analytics",
  agents: [
    { id:"recon",    name:"Recon",    icon:"balance",       job:"Reconciles daily transaction ledgers, flags breaks",          autonomy:"approve", rec:"auto",    status:"ok",    dot:"b-ok"    },
    { id:"sentinel", name:"Sentinel", icon:"shield",        job:"Watches transactions for fraud patterns",                     autonomy:"approve", status:"act",   dot:"b-act"   },
    { id:"reporter", name:"Reporter", icon:"description",   job:"Drafts the daily ops brief and regulator-ready summaries",    autonomy:"suggest", status:"ok",    dot:"b-ok"    },
    { id:"quality",  name:"Quality",  icon:"account_tree",  job:"Monitors data pipelines, proposes schema fixes",              autonomy:"approve", status:"watch", dot:"b-watch" },
    { id:"forecast", name:"Forecast", icon:"trending_up",   job:"Projects liquidity and volume, flags anomalies vs forecast",  autonomy:"suggest", status:"ok",    dot:"b-ok"    },
  ],
  // Items waiting on a human. queueCount is derived from this length everywhere.
  confThreshold: 70,       // below this, the UI forces escalation (Confidence Signal)
  queue: [
    { id:"q1",  agent:"sentinel", action:"Freeze card ending 4471 for 24 hours",        detail:"Velocity rule v4 and geo-jump both tripped on 3 transactions in 6 minutes.", systems:["Cards","Ledger"],            reversible:true,  conf:88, why:["Velocity + geo-jump both fired","Cardholder in known-good travel corridor: no"], read:"3 txns · card history · velocity rule v4" },
    { id:"q2",  agent:"sentinel", action:"Flag merchant MID-90233 for manual review",    detail:"Chargeback rate crossed 1.2% over the trailing 7 days.",                    systems:["Fraud Ops"],                 reversible:true,  conf:76, why:["7-day chargeback rate 1.2% (limit 0.9%)","Volume steady, not a spike"], read:"merchant 7-day history · chargeback ledger" },
    { id:"q3",  agent:"quality",  action:"Apply schema fix to the settlements pipeline",  detail:"Adds a nullable settlement_ref column the new rail requires.",                systems:["Data Pipeline","Warehouse"], reversible:false, conf:71, why:["Matches the documented rail spec","No downstream consumer reads the column yet"], read:"rail spec v2 · pipeline DAG · 4 consumers", diff:{ before:"settlements  (no settlement_ref column)", after:"settlements.settlement_ref  nullable string, indexed" } },
    { id:"q4",  agent:"quality",  action:"Backfill 3 null-rate columns in txn_daily",     detail:"Recompute derived rates for the last 14 partitions.",                        systems:["Warehouse"],                 reversible:true,  conf:83, why:["Source rows are complete","Recompute is idempotent"], read:"txn_daily · 14 partitions · rate defs", diff:{ before:"txn_daily.null_rate  3 columns null across 14 partitions", after:"txn_daily.null_rate  recomputed, 0 nulls" } },
    { id:"q5",  agent:"recon",    action:"Write off 2 ledger breaks under 500 rupees",     detail:"Sub-threshold breaks that aged past 5 days with no counterparty match.",     systems:["Ledger","GL"],               reversible:false, conf:64, why:["Both under the auto-writeoff limit","No counterparty match found in 5 days"], read:"2 breaks · GL policy · aging report", diff:{ before:"GL  2 open breaks under 500, aged 5 days", after:"GL  2 breaks written off, tagged policy AUTO-WO-500" } },
    { id:"q6",  agent:"recon",    action:"Re-run reconciliation for branch 118",          detail:"Overnight batch missed a file; a clean re-run should close it.",              systems:["Ledger"],                    reversible:true,  conf:92, why:["Missing file has now landed","Re-run is a read-then-match, no writes till matched"], read:"branch 118 batch log · file manifest" },
    { id:"q7",  agent:"reporter", action:"Send the 09:00 ops brief to Ops leads",         detail:"Standard daily brief, 6 recipients on the ops distribution list.",           systems:["Email","Reporting"],         reversible:true,  conf:90, why:["All source panels rendered","Distribution list unchanged"], read:"brief draft · distribution list" },
    { id:"q8",  agent:"reporter", action:"Publish regulator summary draft for sign-off",   detail:"Quarterly ops summary; goes to the compliance queue, not to the regulator.", systems:["Reporting","Compliance"],    reversible:false, conf:68, why:["Numbers reconcile to the ledger","One narrative section is thin on context"], read:"quarterly figures · last filing · template" },
    { id:"q9",  agent:"forecast", action:"Raise a liquidity alert for Friday settlement",  detail:"Projected outflow sits near the comfort band for the Friday window.",         systems:["Treasury"],                  reversible:true,  conf:79, why:["Projection within 3% of the band edge","Two large known outflows land Friday"], read:"liquidity model · Friday calendar" },
    { id:"q10", agent:"forecast", action:"Adjust volume forecast +4% for festival week",   detail:"Seasonal uplift the base model underweights.",                               systems:["Forecast Model"],            reversible:true,  conf:74, why:["Last two festival weeks ran +4 to +6%","Base model has no festival feature"], read:"3-year seasonal series · model config" },
    { id:"q11", agent:"quality",  action:"Pause the KYC-docs ingestion job",               detail:"Upstream source is returning malformed records; pause protects the table.",   systems:["Data Pipeline"],             reversible:true,  conf:81, why:["12% of last batch malformed","Table is downstream-critical"], read:"batch error log · schema check" },
    { id:"q12", agent:"sentinel", action:"Add device fingerprint to the watchlist",        detail:"A single device tied to 4 accounts opened in one hour.",                     systems:["Fraud Ops"],                 reversible:true,  conf:85, why:["4 accounts, 1 device, 1 hour","No shared-family signal"], read:"device graph · account open log" },
  ],
  // "Waiting on you" = items whose agent is NOT on Auto, OR whose confidence is below
  // the escalation threshold (the Confidence Signal overrides autonomy). Turning an
  // agent's dial to Auto re-routes its confident items out of this count, live.
  get queueCount(){
    return this.queue.filter(it => {
      const a = this.agents.find(x => x.id === it.agent);
      return !a || a.autonomy !== "auto" || it.conf < this.confThreshold;
    }).length;
  },
  // Cleared decisions feed the Action Audit. Seeded with earlier-today history so the
  // audit is never empty; session approvals/declines/escalations unshift onto the front.
  cleared: [
    { id:"h1", agent:"recon",    action:"Cleared overnight reconciliation, 1,204 entries", decision:"approved",  when:"18m ago", diff:{ before:"branch ledgers  1,206 unmatched at 06:00", after:"1,204 matched, 2 parked for review" } },
    { id:"h2", agent:"sentinel", action:"Blocked card ending 8830 on a velocity breach",   decision:"approved",  when:"42m ago" },
    { id:"h3", agent:"reporter", action:"Sent the close-of-day brief to 6 Ops leads",       decision:"approved",  when:"1h ago" },
    { id:"h4", agent:"quality",  action:"Roll back a malformed partition write",            decision:"declined",  when:"2h ago", reason:"Waiting on data-eng to confirm the source fix first" },
    { id:"h5", agent:"forecast", action:"Raise a liquidity dip flag for Thursday",          decision:"escalated", when:"3h ago" },
    { id:"h6", agent:"quality",  action:"Add an index to speed the settlements join",       decision:"approved",  when:"4h ago", diff:{ before:"settlements join  full scan, ~9s", after:"settlements join  index seek, ~0.4s" } },
  ],
  escInbox: [],            // queue items escalated this session (kind "item")
  escalations: { thisWeek: 3 },
  // The active escalation set = the canon incident (while open) + unresolved session escalations.
  get activeEscalations(){
    const list = [];
    if (this.incident && this.incident.active) list.push(this.incident);
    for (const e of this.escInbox) if (!e.resolved) list.push(e);
    return list;
  },
  incident: {
    id:"inc-sentinel", kind:"incident", active:true, agent:"sentinel",
    title:"Card-present cluster I can't clear on my own",
    opened:"9m ago",
    summary:"Seven card-present transactions on one card, three merchants, one city, inside six minutes. My rules fired, but the pattern doesn't match a known ring and the amounts are large enough that a wrong freeze hurts a real customer.",
    tried:[
      "Ran velocity v4 and geo-jump: both fired",
      "Matched against known fraud rings: no match",
      "Checked the cardholder's travel corridor: inconclusive, no login in 48h",
      "Held the three largest auths pending, let four small ones through",
    ],
    knows:[
      { k:"Transactions", v:"7 in 6 min, 3 merchants, 1 city" },
      { k:"Amounts",      v:"4,200 rupees rising to 48,000" },
      { k:"Card",         v:"No prior fraud, issued 2023" },
      { k:"Cardholder",   v:"No login in 48h, phone on file" },
      { k:"Rules fired",  v:"velocity v4, geo-jump" },
    ],
    recommends:"Freeze the card for 24 hours and place an outbound verification call before releasing it.",
    conf:61,
    timeline:[
      { t:"09:02:11", e:"First auth 4,200 rupees approved, within pattern" },
      { t:"09:04:38", e:"Third auth in three minutes, velocity v4 fires" },
      { t:"09:05:02", e:"Merchant #2 in a different zone, geo-jump fires" },
      { t:"09:06:20", e:"Held the 48,000 rupee auth pending" },
      { t:"09:06:44", e:"No ring match, no recent login: escalated to you" },
    ],
  },
  feed: [                  // most recent first; relative times only, never dates
    { who:"Recon",    what:"Cleared 1,204 matched entries; 2 breaks parked for review", when:"2m ago"  },
    { who:"Sentinel", what:"ESCALATED: card-present cluster, 7 txns, needs a human call", when:"9m ago" },
    { who:"Quality",  what:"Proposed a schema fix for the settlements pipeline",          when:"14m ago" },
    { who:"Reporter", what:"Drafted the 09:00 ops brief, waiting on your review",         when:"31m ago" },
    { who:"Forecast", what:"Liquidity projection updated; within expected band",          when:"48m ago" },
  ],
};
const AUTONOMY_LABEL = { suggest:"Suggest only", approve:"Approve each", auto:"Auto with audit" };

/* ---------- Router ---------- */
const ROUTES = [
  { hash:"#/overview",   nav:"Overview",   glyph:"space_dashboard", title:"Overview" },
  { hash:"#/review",     nav:"Review",     glyph:"checklist",       title:"Review Queue",  badge:() => STORE.queueCount },
  { hash:"#/audit",      nav:"Audit",      glyph:"receipt_long",    title:"Action Audit" },
  { hash:"#/escalation", nav:"Escalation", glyph:"warning",         title:"Escalation",    badge:() => STORE.activeEscalations.length, hot:true },
];
function currentRoute(){
  const h = location.hash || "#/overview";
  if (h.startsWith("#/agent/")) return { hash:h, title:"Agent", agentId:h.split("/")[2] };
  return ROUTES.find(r => r.hash === h) || ROUTES[0];
}

/* ---------- Renderers ---------- */
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderNav(){
  const r = currentRoute();
  const items = ROUTES.map(x => {
    const v = x.badge ? x.badge() : null;
    const badge = x.badge ? `<span class="nav-badge ${x.hot && v>0 ? "hot":""}">${v}</span>` : "";
    return `
    <a class="nav-item ${x.hash===r.hash ? "active":""}" href="${x.hash}">
      <span class="glyph" aria-hidden="true">${x.glyph}</span>${x.nav}
      ${badge}
    </a>`;
  }).join("");
  const agents = STORE.agents.map(a => `
    <a class="nav-item ${r.agentId===a.id ? "active":""}" href="#/agent/${a.id}">
      <span class="agent-ico msr ag-${a.status}" aria-hidden="true">${a.icon}</span>${a.name}
      <span class="nav-badge au-${a.autonomy}">${AUTONOMY_LABEL[a.autonomy].split(" ")[0]}</span>
    </a>`).join("");
  $("#sidenav").innerHTML = `${items}<div class="side-label">Agent Fleet</div>${agents}`;
}

function screenOverview(){
  const fleet = STORE.agents.map(a => `
    <a class="row" href="#/agent/${a.id}" style="text-decoration:none">
      <span class="agent-ico msr ag-${a.status}">${a.icon}</span>
      <span class="who">${a.name}</span>
      <span class="what">${esc(a.job)}</span>
      <span class="pill au-${a.autonomy}">${AUTONOMY_LABEL[a.autonomy]}</span>
    </a>`).join("");
  const feed = STORE.feed.map(f => `
    <div class="row">
      <span class="who">${f.who}</span>
      <span class="what ${f.what.startsWith("ESCALATED") ? "s-act":""}">${esc(f.what)}</span>
      <span class="when">${f.when}</span>
    </div>`).join("");
  return `
    <div class="grid cols-3">
      <div class="panel kpi k1"><span class="v">${STORE.agents.length}</span><span class="l">Agents on the floor</span></div>
      <div class="panel kpi k2"><span class="v">${STORE.queueCount}</span><span class="l">Waiting on you</span></div>
      <div class="panel kpi k3"><span class="v">${STORE.activeEscalations.length}</span><span class="l">Active escalation${STORE.activeEscalations.length===1?"":"s"} &middot; ${STORE.escalations.thisWeek} this week</span></div>
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Agent Fleet</h2><span class="mono">autonomy is per agent, per action class</span></div>
      ${fleet}
    </div>
    <div class="panel">
      <div class="panel-h"><h2>Activity</h2><span class="mono">live feed</span></div>
      ${feed}
    </div>`;
}

const AUTONOMY_DESC = {
  suggest: "Proposes only. Nothing happens until you pick it up.",
  approve: "Acts only after you approve each action, one by one.",
  auto:    "Acts on its own when confident, and logs every action to the audit. Anything below your threshold still comes to you.",
};
function decisionBadge(d){
  const map = { approved:["s-ok","Approved"], declined:["s-act","Declined"], escalated:["s-watch","Escalated"], resolved:["s-info","Resolved"] };
  const [cls,label] = map[d] || ["s-info", d];
  return `<span class="dec ${cls}">${label}</span>`;
}
function laneItem(it, held){
  return `
  <div class="lane-item">
    <span class="agent-dot ${held ? "b-watch" : (isWaiting(it) ? "b-info" : "b-ok")}"></span>
    <span class="li-act">${esc(it.action)}</span>
    ${held ? `<span class="li-tag held">held &middot; ${it.conf}%</span>`
           : `<span class="li-tag">${it.conf}%</span>`}
  </div>`;
}
function screenAgent(id){
  const a = STORE.agents.find(x => x.id === id);
  if (!a) return `<div class="panel stub">Unknown agent.</div>`;
  const wait = waitingFor(id), flow = flowingFor(id);
  const recHint = a.rec && a.rec !== a.autonomy
    ? `<span class="dial-rec">Recommended: ${AUTONOMY_LABEL[a.rec]}</span>` : "";
  const modes = ["suggest","approve","auto"].map(m => `
    <button class="dial-seg ${a.autonomy===m ? "on":""}" onclick="setAutonomy('${id}','${m}')" aria-pressed="${a.autonomy===m}">
      ${AUTONOMY_LABEL[m]}
    </button>`).join("");
  const hist = STORE.cleared.filter(c => c.agent === id);
  const histRows = hist.length
    ? hist.map(c => `
      <div class="row">
        <span class="what">${esc(c.action)}</span>
        ${decisionBadge(c.decision)}
        <span class="when">${c.when}</span>
      </div>`).join("")
    : `<div class="row"><span class="what" style="color:var(--dim)">No decisions logged for ${a.name} yet.</span></div>`;
  return `
    <div class="panel">
      <div class="panel-h">
        <span class="agent-ico msr ag-${a.status}" style="font-size:22px">${a.icon}</span><h2>${a.name}</h2>
        <span class="pill s-${a.status==="ok"?"ok":a.status}"><span class="dot ${a.dot}"></span>${a.status==="act"?"needs you":a.status==="watch"?"watch":"healthy"}</span>
      </div>
      <div class="panel-b" style="color:var(--muted)">${esc(a.job)}.</div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2>Autonomy</h2><span class="mono">how far ${a.name} can go on its own</span>${recHint}</div>
      <div class="panel-b">
        <div class="dial" role="group" aria-label="Autonomy for ${a.name}">${modes}</div>
        <p class="dial-desc">${AUTONOMY_DESC[a.autonomy]}</p>
      </div>
      <div class="lanes">
        <div class="lane">
          <div class="lane-h"><span class="lane-title">Waiting on you</span><span class="lane-n">${wait.length}</span></div>
          ${wait.length ? wait.map(it => laneItem(it, a.autonomy==="auto" && it.conf < STORE.confThreshold)).join("")
                        : `<div class="lane-empty">Nothing waiting on you.</div>`}
        </div>
        <div class="lane">
          <div class="lane-h"><span class="lane-title">Flowing through</span><span class="lane-n">${flow.length}</span></div>
          ${flow.length ? flow.map(it => laneItem(it, false)).join("")
                        : `<div class="lane-empty">Set ${a.name} to Auto and its confident actions move here, no approval needed.</div>`}
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-h"><h2>Decision history</h2><span class="mono">what you and ${a.name} settled</span></div>
      ${histRows}
    </div>`;
}

/* ---------- Trust pattern 4: Action Audit ---------- */
let auditFilter = "all";
let replayIdx = 0;
function auditRow(c){
  const ag = agentById(c.agent);
  const ico = ag.icon ? `<span class="agent-ico msr ag-${ag.status||"ok"}" style="font-size:16px">${ag.icon}</span>` : "";
  const hasDetail = !!(c.diff || c.reason);
  return `
  <div class="arow" id="ar-${c.id}">
    <button class="arow-main" ${hasDetail ? `onclick="toggleAudit('${c.id}')"` : `style="cursor:default"`}>
      <span class="ar-agent">${ico}<span class="who">${ag.name}</span></span>
      <span class="what">${esc(c.action)}</span>
      ${decisionBadge(c.decision)}
      <span class="when">${c.when}</span>
      <span class="arow-caret msr">${hasDetail ? "chevron_right" : ""}</span>
    </button>
    ${hasDetail ? `<div class="arow-detail">
      ${c.diff ? `<div class="diff">
        <div class="diff-row"><span class="diff-tag before">before</span><span class="diff-v">${esc(c.diff.before)}</span></div>
        <div class="diff-row"><span class="diff-tag after">after</span><span class="diff-v">${esc(c.diff.after)}</span></div>
      </div>` : ""}
      ${c.reason ? `<div class="areason"><b>Your reason:</b> ${esc(c.reason)}</div>` : ""}
    </div>` : ""}
  </div>`;
}
function incidentReplayPanel(){
  const inc = STORE.incident; const tl = inc.timeline;
  const steps = tl.map((s,i) => `
    <div class="rp-step ${i<=replayIdx?"on":""} ${i===replayIdx?"cur":""}">
      <span class="rp-t mono">${s.t}</span>
      <span class="rp-dot"></span>
      <span class="rp-e">${esc(s.e)}</span>
    </div>`).join("");
  return `
    <div class="panel">
      <div class="panel-h">
        <h2>Incident replay</h2>
        <span class="mono">${agentById(inc.agent).name} &middot; step ${replayIdx+1} of ${tl.length}</span>
        <div class="rp-ctrl">
          <button class="btn ghost" onclick="replayJump(-1)" ${replayIdx===0?"disabled":""}>Prev</button>
          <button class="btn" onclick="replayJump(1)" ${replayIdx===tl.length-1?"disabled":""}>Next</button>
          <button class="btn ghost" onclick="replayReset()">Restart</button>
        </div>
      </div>
      <div class="panel-b"><div class="rp">${steps}</div></div>
    </div>`;
}
function screenAudit(){
  const filters = ["all","approved","declined","escalated"];
  const rows = STORE.cleared.filter(c => auditFilter==="all" || c.decision===auditFilter);
  const fbar = filters.map(f => `
    <button class="fchip ${auditFilter===f?"on":""}" onclick="setAuditFilter('${f}')">
      ${f==="all"?"All":f[0].toUpperCase()+f.slice(1)}
      <span class="fchip-n">${f==="all"?STORE.cleared.length:STORE.cleared.filter(c=>c.decision===f).length}</span>
    </button>`).join("");
  const list = rows.length ? rows.map(auditRow).join("")
                           : `<div class="lane-empty" style="padding:22px">No ${auditFilter} actions logged.</div>`;
  return `
    <div class="review-head">
      <h2>Action Audit</h2>
      <span class="mono">${STORE.cleared.length} logged &middot; every decision, who made it, and what changed</span>
    </div>
    <div class="fbar">${fbar}</div>
    <div class="panel">${list}</div>
    ${incidentReplayPanel()}`;
}
window.setAuditFilter = (f) => { auditFilter = f; render(); };
window.toggleAudit = (id) => { const el = document.getElementById("ar-" + id); if (el) el.classList.toggle("open"); };
window.replayJump = (d) => { replayIdx = Math.max(0, Math.min(STORE.incident.timeline.length-1, replayIdx + d)); render(); };
window.replayReset = () => { replayIdx = 0; render(); };

/* ---------- Trust pattern 5: Escalation Pathway ---------- */
function escCard(e){
  const a = agentById(e.agent);
  const isInc = e.kind === "incident";
  const knows = isInc
    ? e.knows.map(k => `<div class="kv"><span class="kv-k">${esc(k.k)}</span><span class="kv-v">${esc(k.v)}</span></div>`).join("")
    : `<div class="kv"><span class="kv-k">Read</span><span class="kv-v">${esc(e.read)}</span></div>` +
      (e.why||[]).map(w => `<div class="kv"><span class="kv-k">Signal</span><span class="kv-v">${esc(w)}</span></div>`).join("");
  const tried = isInc
    ? `<div class="esc-block"><h4>What ${a.name} tried</h4><ul class="esc-list">${e.tried.map(t=>`<li>${esc(t)}</li>`).join("")}</ul></div>` : "";
  const rec = isInc ? e.recommends : e.title;
  return `
  <div class="panel esc">
    <div class="esc-head">
      <span class="agent-dot ${a.dot}"></span>
      <div class="esc-head-t">
        <div class="esc-title">${esc(e.title)}</div>
        <div class="esc-sub mono">${a.name} &middot; opened ${e.opened || e.when || "just now"}</div>
      </div>
      <span class="pill s-act"><span class="dot b-act"></span>needs a human</span>
    </div>
    ${e.summary ? `<p class="esc-summary">${esc(e.summary)}</p>` : ""}
    <div class="esc-cols">
      ${tried}
      <div class="esc-block"><h4>What it knows</h4><div class="kvs">${knows}</div></div>
    </div>
    <div class="esc-rec">
      <div class="esc-rec-l"><span class="mono">Recommends</span><span class="conf-mini">confidence ${e.conf}%</span></div>
      <p>${esc(rec)}</p>
    </div>
    <div class="esc-actions">
      <button class="btn primary" onclick="escResolve('${e.id}','approved')">Approve the recommendation</button>
      <button class="btn" onclick="escResolve('${e.id}','resolved')">I'll take it from here</button>
      <button class="btn warn" onclick="escSendBack('${e.id}')">Send back with guidance</button>
      <div class="decline-box" id="esc-dec-${e.id}">
        <input type="text" id="esc-reason-${e.id}" placeholder="What should ${a.name} do differently?" onkeydown="if(event.key==='Enter')escConfirmBack('${e.id}')">
        <button class="btn warn" onclick="escConfirmBack('${e.id}')">Send back</button>
      </div>
    </div>
  </div>`;
}
function screenEscalation(){
  const active = STORE.activeEscalations;
  if (!active.length){
    return `<div class="panel empty">
      <div class="ring">&#10003;</div>
      <h3>No open escalations.</h3>
      <p>When an agent hits something it should not decide alone, it lands here with everything you need to make the call.</p>
    </div>`;
  }
  return `
    <div class="review-head">
      <h2>Escalation</h2>
      <span class="mono">${active.length} open &middot; the agent did the legwork; the judgment is yours</span>
    </div>
    ${active.map(escCard).join("")}`;
}
function escFind(id){ return STORE.activeEscalations.find(e => e.id === id); }
function escClose(id){
  if (STORE.incident && STORE.incident.id === id){ STORE.incident.active = false; return STORE.incident; }
  const e = STORE.escInbox.find(x => x.id === id); if (e) e.resolved = true; return e;
}
window.escResolve = (id, decision) => {
  const e = escFind(id); if (!e) return; const a = agentById(e.agent);
  escClose(id);
  STORE.cleared.unshift({ id:"e-"+id+"-"+decision, agent:e.agent, action:`Escalation: ${e.title}`,
    decision, when:"just now", reason: decision==="resolved" ? "You took this over manually" : null });
  render();
  toast(decision==="approved" ? `Approved. ${a.name} will carry out its recommendation.`
                              : `You've taken it over. ${a.name} stands down.`, "Logged to the action audit.");
};
window.escSendBack = (id) => {
  const box = document.getElementById("esc-dec-" + id);
  if (box){ box.classList.add("open"); const inp = document.getElementById("esc-reason-" + id); if (inp) inp.focus(); }
};
window.escConfirmBack = (id) => {
  const inp = document.getElementById("esc-reason-" + id);
  const reason = (inp && inp.value.trim()) || "";
  if (!reason){ if (inp){ inp.focus(); inp.style.borderColor = "var(--act)"; } return; }
  const e = escFind(id); const a = e ? agentById(e.agent) : { name:"The agent" };
  escClose(id);
  STORE.cleared.unshift({ id:"e-"+id+"-back", agent:e?e.agent:"", action:`Sent back: ${e?e.title:""}`,
    decision:"declined", when:"just now", reason });
  render();
  toast(`Sent back to ${a.name} with your guidance.`, `"${reason}"`);
};

const agentById = (id) => STORE.agents.find(a => a.id === id) || { name:id, dot:"b-info", autonomy:"approve" };
/* Routing derives from the dial: an item waits on a human unless its agent is on Auto
   AND its confidence clears the threshold. This is what the Autonomy Dial re-routes. */
const isWaiting = (it) => { const a = agentById(it.agent); return a.autonomy !== "auto" || it.conf < STORE.confThreshold; };
const waitingItems = () => STORE.queue.filter(isWaiting);
const flowingFor = (id) => STORE.queue.filter(it => it.agent === id && !isWaiting(it));
const waitingFor = (id) => STORE.queue.filter(it => it.agent === id && isWaiting(it));

/* ---------- Trust pattern 1: Intent Preview / Review Queue ---------- */
function intentCard(it){
  const a = agentById(it.agent);
  const below = it.conf < STORE.confThreshold;
  const primary = below
    ? `<button class="btn warn" onclick="escalateItem('${it.id}')">Escalate to review</button>`
    : `<button class="btn primary" onclick="approveItem('${it.id}')">Approve</button>`;
  return `
  <div class="ip" data-id="${it.id}">
    <div class="ip-head">
      <div class="ip-action">${esc(it.action)}</div>
      <div class="ip-agent-tag"><span class="agent-ico msr ag-${a.status||"ok"}">${a.icon||"smart_toy"}</span>${a.name}</div>
    </div>
    <div class="ip-detail">${esc(it.detail)}</div>
    <div class="ip-meta">
      ${it.systems.map(s => `<span class="chip sys">${esc(s)}</span>`).join("")}
      <span class="chip ${it.reversible ? "rev":"hard"}">${it.reversible ? "Reversible" : "Hard to reverse"}</span>
    </div>
    <div class="ip-read"><b>Read to decide:</b> ${esc(it.read)}</div>
    <div class="conf">
      <div class="conf-row">
        <span class="conf-lbl">Confidence</span>
        <div class="conf-bar"><div class="conf-fill" style="width:${it.conf}%;background:var(--info)"></div></div>
        <span class="conf-val">${it.conf}%</span>
        <button class="conf-toggle" onclick="toggleWhy('${it.id}')">why</button>
      </div>
      <ul class="conf-why" id="why-${it.id}">${it.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
      ${below ? `<div class="below"><span class="msr" style="font-size:17px">warning</span> Below your ${STORE.confThreshold}% escalation threshold. It cannot be auto-approved; a human has to make this call.</div>` : ""}
    </div>
    <div class="ip-actions">
      ${primary}
      <button class="btn ghost" onclick="openDecline('${it.id}')">Decline</button>
      <div class="decline-box" id="dec-${it.id}">
        <input type="text" id="reason-${it.id}" placeholder="Reason (the agent factors this into future proposals)" onkeydown="if(event.key==='Enter')confirmDecline('${it.id}')">
        <button class="btn warn" onclick="confirmDecline('${it.id}')">Decline with reason</button>
      </div>
    </div>
  </div>`;
}

function screenReview(){
  const items = waitingItems();
  const flowing = STORE.queue.length - items.length;
  if (!items.length){
    return `<div class="panel empty">
      <div class="ring">&#10003;</div>
      <h3>Queue clear.</h3>
      <p>Nothing is waiting on you.${flowing ? ` ${flowing} action${flowing===1?" is":"s are"} flowing through on Auto, logged to the audit.` : " New proposals will land here."}</p>
    </div>`;
  }
  return `
    <div class="review-head">
      <h2>Review Queue</h2>
      <span class="mono">${items.length} waiting on you${flowing ? ` &middot; ${flowing} flowing through on Auto` : ""} &middot; each card is what an agent intends to do, before it acts</span>
    </div>
    ${items.map(intentCard).join("")}`;
}

/* interactions (single source of truth: mutate STORE.queue, then re-render) */
window.toggleWhy = (id) => {
  const el = document.getElementById("why-" + id);
  if (el) el.classList.toggle("open");
};
function resolveItem(id, decision, reason){
  const i = STORE.queue.findIndex(x => x.id === id);
  if (i < 0) return null;
  const [item] = STORE.queue.splice(i, 1);
  STORE.cleared.unshift({ ...item, decision, reason: reason || null, when: "just now" });
  return item;
}
function animateOutThenRender(id, after){
  const card = document.querySelector(`.ip[data-id="${id}"]`);
  const go = () => { after(); render(); };
  if (!card || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return go();
  card.classList.add("leaving");
  setTimeout(go, 200);
};
window.approveItem = (id) => {
  const it = STORE.queue.find(x => x.id === id); if (!it) return;
  const a = agentById(it.agent);
  animateOutThenRender(id, () => resolveItem(id, "approved"));
  toast(`Approved. ${a.name} will act now.`, "Logged to the action audit.");
};
window.escalateItem = (id) => {
  const it = STORE.queue.find(x => x.id === id); if (!it) return;
  animateOutThenRender(id, () => {
    STORE.escInbox.unshift({ id:it.id, kind:"item", agent:it.agent, title:it.action, summary:it.detail,
      conf:it.conf, why:it.why, read:it.read, systems:it.systems, reversible:it.reversible, resolved:false, when:"just now" });
    resolveItem(id, "escalated");
  });
  toast("Escalated. It's on the Escalation screen now.", "Low confidence needs a human call.");
};
window.openDecline = (id) => {
  const box = document.getElementById("dec-" + id);
  if (box){ box.classList.add("open"); const inp = document.getElementById("reason-" + id); if (inp) inp.focus(); }
};
window.confirmDecline = (id) => {
  const inp = document.getElementById("reason-" + id);
  const reason = (inp && inp.value.trim()) || "";
  if (!reason){ if (inp){ inp.focus(); inp.style.borderColor = "var(--act)"; } return; }
  const it = STORE.queue.find(x => x.id === id); const a = it ? agentById(it.agent) : { name:"The agent" };
  animateOutThenRender(id, () => resolveItem(id, "declined", reason));
  toast(`Declined. ${a.name} will factor that into future proposals.`, `"${reason}"`);
};

/* Trust pattern 2: Autonomy Dial. Turning it re-routes this agent's confident items
   between the "waiting on you" and "flowing through" lanes, and updates every count
   that reads from the store (Overview KPI, Review badge, sidebar chip). */
window.setAutonomy = (id, mode) => {
  const a = STORE.agents.find(x => x.id === id);
  if (!a || a.autonomy === mode) return;
  a.autonomy = mode;
  render();
  if (mode === "auto"){
    const moved = flowingFor(id).length;
    const held  = waitingFor(id).filter(it => it.conf < STORE.confThreshold).length;
    toast(`${a.name} is on Auto.`, moved
      ? `${moved} confident action${moved===1?"":"s"} now flow${moved===1?"s":""} without you${held?`; ${held} held below threshold`:""}.`
      : "It will act when confident and log everything.");
  } else {
    toast(`${a.name} set to ${AUTONOMY_LABEL[mode]}.`, "Its actions wait for your call now.");
  }
};

/* toast */
let toastTimer;
function toast(msg, sub){
  let t = document.getElementById("toast");
  if (!t){ t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); }
  t.innerHTML = `${esc(msg)}${sub ? ` <span class="mono">${esc(sub)}</span>` : ""}`;
  requestAnimationFrame(() => t.classList.add("show"));
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2800);
}

function render(){
  const r = currentRoute();
  renderNav();
  let html;
  if (r.agentId) html = screenAgent(r.agentId);
  else if (r.hash === "#/overview") html = screenOverview();
  else if (r.hash === "#/review") html = screenReview();
  else if (r.hash === "#/audit") html = screenAudit();
  else if (r.hash === "#/escalation") html = screenEscalation();
  else html = screenOverview();
  const agent = r.agentId ? STORE.agents.find(x=>x.id===r.agentId) : null;
  $("#screen-title").textContent = agent ? agent.name : r.title;
  $("#screen-crumb").textContent = `${STORE.bank} · ${STORE.team}`;
  $("#main").innerHTML = `
    <div class="screen">
      <p class="mobile-note">Best experienced on desktop; this console is data-dense by design.</p>
      ${html}
      <div class="foot-note">
        <b>Why this exists:</b> a working study of the five agent-trust patterns (intent preview, autonomy dial,
        confidence, audit, escalation) for Crux, an AI decision-intelligence concept. Reconstructed from secondary
        research; no primary research conducted. All data is fictional.
      </div>
    </div>`;
}

window.addEventListener("hashchange", render);
render();
</script>
</body>
</html>
